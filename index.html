<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Son kullanılan gündüz/gece modunu React yüklenmeden önce uygula (flash önleme). */
      (function () {
        var key = 'bach-appearance';
        var saved = localStorage.getItem(key) || 'day';
        var root = document.documentElement;
        root.classList.remove('night', 'light', 'morning', 'evening', 'space', 'special');
        if (saved === 'night') root.classList.add('night');
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BACHMAIN CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
