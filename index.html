<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Son kullanılan gündüz/gece modunu React yüklenmeden önce uygula (flash önleme). */
      (function () {
        var key = 'bach-appearance';
        var saved = localStorage.getItem(key) || 'day';
        var root = document.documentElement;
        root.classList.remove('night', 'light', 'morning', 'evening', 'space', 'special');
        if (saved === 'night') root.classList.add('night');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BACHMAIN CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
