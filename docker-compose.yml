services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://bach:bach@db:5432/bachmain
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bach
      POSTGRES_PASSWORD: bach
      POSTGRES_DB: bachmain
    ports:
      - "5432:5432"
    volumes:
      - bach_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bachmain
      MINIO_ROOT_PASSWORD: bachmainsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bach_minio:/data
    restart: unless-stopped

volumes:
  bach_pgdata:
  bach_minio:
