global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: bachmain-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          service: bachmain-api

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: containers
